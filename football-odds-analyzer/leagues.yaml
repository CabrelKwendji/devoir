# Référentiel des championnats acceptés.
#
# Seuls les championnats listés ici sont conservés ; tout championnat absent
# est exclu par défaut (motif « championnat non référencé »).
# Seules les ligues dont tier <= MAX_LEAGUE_TIER (config.py, 2 par défaut) sont gardées.
#
# Champs :
#   oddsportal      : chemin OddsPortal "pays/ligue" (tel qu'il apparaît dans l'URL
#                     https://www.oddsportal.com/football/<pays>/<ligue>/)
#   aliases         : autres chemins possibles (les ligues changent de nom au gré des sponsors)
#   name            : nom affiché
#   country         : pays affiché
#   tier            : niveau (1 = première division, 2 = deuxième division, ...)
#   api_football_id : identifiant de la ligue chez API-Football (facultatif).
#                     S'il est absent, l'application le recherche via /leagues
#                     (nom + pays) et met le résultat en cache.
#                     À vérifier sur https://dashboard.api-football.com si besoin.

leagues:
  # --- Angleterre ---
  - {oddsportal: england/premier-league, name: Premier League, country: Angleterre, tier: 1, api_football_id: 39}
  - {oddsportal: england/championship, name: Championship, country: Angleterre, tier: 2, api_football_id: 40}
  - {oddsportal: england/league-one, name: League One, country: Angleterre, tier: 3, api_football_id: 41}
