<span>
{% if m.analysis %}
  <a href="/analyse#m-{{ m.id }}" class="inline-block px-2 py-1 rounded text-xs font-semibold
     {% if m.analysis.error %}bg-slate-200{% elif m.analysis.score == 3 %}bg-emerald-100 text-emerald-800{% elif m.analysis.score == 2 %}bg-amber-100 text-amber-800{% else %}bg-red-100 text-red-800{% endif %}">
    {% if m.analysis.error %}N/D{% else %}{{ m.analysis.score }}/3{% endif %}
  </a>
{% endif %}
  <button class="bg-sky-600 hover:bg-sky-500 text-white px-2 py-1 rounded text-xs"
          hx-post="/analyse/{{ m.id }}" hx-target="closest span" hx-swap="outerHTML"
          hx-indicator="this">
    <span class="htmx-indicator">…</span>{{ "Réanalyser" if m.analysis else "Analyser" }}
  </button>
</span>
